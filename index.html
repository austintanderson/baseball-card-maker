<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball Card Maker</title>
<meta name="description" content="Make custom youth baseball cards in your browser: edit text, colors and photos, then print or download.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEE8;--panel:#FFFFFF;--ink:#15211A;--muted:#5A685F;--line:#D3DBD4;--field:#F5F8F4;
  --focus:#2E8B3E;--btn:#0E3B21;--btn-ink:#F3EAC8;color-scheme:light;
  --display:'Graduate',Rockwell,'Roboto Slab',Georgia,serif;
  --body:'Archivo Narrow','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1511;--panel:#17201A;--ink:#E6ECE7;--muted:#9AA79E;--line:#2B372F;--field:#1E2922;
  --focus:#6BBF59;--btn:#6BBF59;--btn-ink:#0D1A11;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:370px 1fr;height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.panel header{position:sticky;top:0;z-index:3;background:var(--panel);padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.panel h1{font-size:18px;margin:0 0 2px}
.panel header p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details{border-bottom:1px solid var(--line)}
summary{padding:13px 18px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px}
details[open] summary::after{content:"\2212"}
.fields{padding:0 18px 18px;display:grid;gap:11px}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fields input[type=text],.fields textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.fields textarea{min-height:150px;resize:vertical;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs{display:grid;gap:6px}
.pairs .head{font-size:13px;color:var(--muted)}
.pair{display:grid;grid-template-columns:120px 1fr;gap:6px}
.color{display:flex!important;align-items:center;justify-content:space-between;color:var(--ink)!important}
.color input{width:46px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--field);cursor:pointer}
.check{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important}
.check input{width:16px;height:16px;accent-color:var(--focus)}
.range{grid-template-columns:1fr auto;align-items:center}
.range span{grid-column:1/-1}
.range input{width:100%;accent-color:var(--focus)}
.img{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.img .btns{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.stage{overflow:auto;padding:28px;display:flex;flex-wrap:wrap;gap:28px;align-content:flex-start;justify-content:center}
.slot{display:flex;flex-direction:column;gap:8px}
.slot .cap{font-size:13px;color:var(--muted)}
.frame{position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:4px;overflow:hidden}
.frame > .card{position:absolute;left:0;top:0;transform-origin:0 0}
.frame.front .f-photo{cursor:grab}
.frame.front .f-photo.dragging{cursor:grabbing}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(520px,90vw);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#print{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.panel{border-right:0;border-bottom:1px solid var(--line)}.panel header{position:static}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- the card itself ---------- */
.card{font-family:var(--body);color:var(--dark);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card *{box-sizing:border-box}
.card.front{width:750px;height:1050px;padding:32px;background:var(--cream);position:relative;overflow:hidden}
.f-inner{position:relative;width:686px;height:986px;border:12px solid var(--accent);border-radius:20px;background:var(--dark);overflow:hidden}
.f-top{position:absolute;left:0;top:0;right:0;height:64px;background:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;border-bottom:6px solid var(--dark)}
.f-school{font-family:var(--display);font-size:30px;letter-spacing:1px;color:var(--dark);white-space:nowrap}
.f-league{font-weight:700;font-size:20px;letter-spacing:2px;color:var(--accent);white-space:nowrap}
.f-photo{position:absolute;left:0;top:70px;right:0;bottom:196px;background:var(--photo-bg);overflow:hidden;touch-action:none}
.f-photo-img{position:absolute;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.f-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cream);opacity:.55;font-size:30px;font-family:var(--display)}
.f-num{position:absolute;top:32px;left:521px;width:104px;height:104px;border-radius:52px;background:var(--cream);border:6px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center}
.f-num-l{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.f-num-n{font-family:var(--display);font-size:44px;line-height:1;color:var(--dark)}
.f-badge{position:absolute;left:35px;top:521px;width:118px;height:104px;background:center/contain no-repeat}
.f-badge svg{display:block;width:100%;height:100%}
.f-bottom{position:absolute;left:0;right:0;bottom:0;height:196px;background:var(--dark);border-top:8px solid var(--cream)}
.f-pos{position:absolute;right:0;top:-54px;height:54px;padding:0 28px 0 16px;background:var(--accent);display:flex;align-items:center;font-family:var(--display);font-size:30px;color:var(--cream);letter-spacing:2px;white-space:nowrap}
.f-pos-cut{position:absolute;left:-24px;top:0;width:0;height:0;border-bottom:54px solid var(--accent);border-left:24px solid transparent}
.f-names{position:absolute;left:228px;right:24px;top:26px;display:flex;flex-direction:column;gap:6px}
.f-first,.f-last{font-family:var(--display);font-size:var(--ns);line-height:1;color:var(--cream);white-space:nowrap}
.f-last{color:var(--last)}
.f-team{font-size:20px;font-weight:700;letter-spacing:3px;color:var(--team);margin-top:6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;white-space:nowrap}
.f-serial{font-family:var(--display);font-size:23px;line-height:1;letter-spacing:5px;color:var(--stamp);text-shadow:-1px -1px 1px rgba(0,0,0,.75),-2px -2px 2px rgba(0,0,0,.35),1px 1px 0 rgba(255,255,255,.28),2px 2px 1px rgba(255,255,255,.1)}
.f-logo{position:absolute;left:18px;bottom:18px;width:196px;height:234px;background:center/contain no-repeat}

.card.back{width:1050px;height:750px;padding:28px;background:var(--dark);position:relative;overflow:hidden}
.b-inner{height:100%;background:var(--cream);border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:20px;color:var(--dark)}
.b-head{display:flex;align-items:center;gap:24px}
.b-circle{width:96px;height:96px;flex-shrink:0;border-radius:48px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:40px;color:var(--cream)}
.b-id{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.b-name{font-family:var(--display);font-size:48px;line-height:1;color:var(--dark);white-space:nowrap}
.b-sub{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--accent)}
.b-logo{width:96px;height:115px;flex-shrink:0;background:center/contain no-repeat}
.b-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid var(--dark);border-bottom:4px solid var(--dark)}
.b-stat{padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.card .lbl{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.b-stat .val{font-size:26px;font-weight:700}
.b-facts-wrap{display:flex;flex-direction:column;gap:6px}
.b-facts-h{font-family:var(--display);font-size:24px;color:var(--dark)}
.b-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.b-fact{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-bottom:2px dotted var(--rule)}
.b-fact .lbl{width:170px;flex-shrink:0}
.b-fact .val{font-size:24px;font-weight:700;min-width:0}
.b-foot{flex:1;display:flex;gap:20px;align-items:stretch;min-height:0}
.b-note{flex:1;background:var(--accent);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;color:var(--cream);overflow:hidden}
.b-note-h{font-family:var(--display);font-size:24px}
.b-note-t{font-size:var(--nts);line-height:1.3}
.b-season{width:220px;flex-shrink:0;border:4px solid var(--dark);border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center}
.b-season .s-sm{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.b-season .s-lg{font-family:var(--display);font-size:26px;color:var(--dark)}

/* ---------- printing: one card per page, real trading-card size ---------- */
@page front{size:2.5in 3.5in;margin:0}
@page back{size:3.5in 2.5in;margin:0}
@page backp{size:2.5in 3.5in;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  body > :not(#print){display:none!important}
  #print{display:block}
  .pp{position:relative;overflow:hidden;break-after:page;page-break-after:always}
  .pp:last-child{break-after:auto;page-break-after:auto}
  .pp-front{page:front;width:2.5in;height:3.5in}
  .pp-back{page:back;width:3.5in;height:2.5in}
  .pp-back.rot{page:backp;width:2.5in;height:3.5in}
  .pp .card{position:absolute;left:0;top:0;zoom:.32}
  .pp-back.rot .card{left:auto;right:0;transform-origin:100% 0;transform:rotate(90deg) translateX(100%)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" aria-label="Card editor">
    <header>
      <h1>Baseball Card Maker</h1>
      <p>Edit on the left, see changes on the right. Your work saves in this browser automatically.</p>
      <div class="actions">
        <button class="primary" data-act="print">Print / save PDF</button>
        <button data-act="png-front">Front PNG</button>
        <button data-act="png-back">Back PNG</button>
        <button data-act="save">Save design file</button>
        <button data-act="open">Open design file</button>
        <button data-act="new">New player</button>
        <button data-act="reset">Reset to template</button>
      </div>
      <input type="file" id="openFile" accept=".json,application/json" class="sr" tabindex="-1">
    </header>
    <div id="fields"></div>
  </aside>
  <main class="stage" id="stage">
    <div class="slot"><div class="cap">Front · drag the photo to move it</div><div class="frame front" id="frameFront"></div></div>
    <div class="slot"><div class="cap">Back</div><div class="frame back" id="frameBack"></div></div>
  </main>
</div>
<div id="print"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imgFile" accept="image/*" class="sr" tabindex="-1">

const STORE_KEY = 'baseball-card-template:v1';
let S = clone(DEFAULTS);
let scale = .5;
let photoDims = null;

function clone(o){return JSON.parse(JSON.stringify(o))}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const cssUrl = u => String(u||'').replace(/["'()\\\s]/g, c => encodeURIComponent(c));
const okUrl = u => typeof u === 'string' && /^(data:image\/|https?:\/\/|\.{0,2}\/|[\w-]+\.)/i.test(u) ? u : '';
const get = p => p.split('.').reduce((o,k) => o == null ? o : o[k], S);
function set(p,v){const k=p.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);o[k[k.length-1]]=v}

/* ---------- panel definition ---------- */
const SCHEMA = [
  {title:'Player', open:true, items:[
    ['row',[['text','first','First name'],['text','last','Last name']]],
    ['row',[['text','number','Jersey number'],['text','position','Position']]],
    ['text','team','Team name'],
  ]},
  {title:'Photo and logos', open:true, items:[
    ['image','photo','Player photo'],
    ['range','photoZoom','Photo zoom',1,3,.01],
    ['hint','Drag the photo on the card to reposition it.'],
    ['image','logo','Team logo (best as a PNG with a transparent background)'],
    ['image','badge','Rookie badge (optional custom image)'],
  ]},
  {title:'Card front', items:[
    ['text','school','Top banner, left'],
    ['text','league','Top banner, right'],
    ['text','serial','Serial stamp'],
    ['check','showSerial','Show serial stamp'],
    ['check','showNumber','Show number badge'],
    ['check','showRookie','Show rookie badge'],
    ['range','nameSize','Name size',30,64,1],
  ]},
  {title:'Card back', items:[
    ['text','backCircle','Circle at top left'],
    ['pairs','stats','Stats row (label, value)'],
    ['text','factsTitle','Quick facts heading'],
    ['pairs','facts','Quick facts (label, value)'],
  ]},
  {title:"Coach's note", items:[
    ['text','noteTitle','Heading'],
    ['textarea','note','Note'],
    ['range','noteSize','Note text size',14,28,1],
    ['text','season.0','Season box, line 1'],
    ['text','season.1','Season box, line 2'],
    ['text','season.2','Season box, line 3'],
  ]},
  {title:'Colors', items:[
    ['color','colors.accent','Accent (borders, labels, note box)'],
    ['color','colors.dark','Dark (card body)'],
    ['color','colors.cream','Light (frame and text)'],
    ['color','colors.photoBg','Behind the photo'],
    ['color','colors.lastName','Last name'],
    ['color','colors.teamName','Team name on front'],
    ['color','colors.stamp','Serial stamp'],
    ['color','colors.rule','Dotted lines on back'],
  ]},
];
let uid = 0;
function field(it){
  const [type,key,label,a,b,c] = it, id = 'f'+(++uid);
  if(type==='row') return `<div class="row">${key.map(field).join('')}</div>`;
  if(type==='hint') return `<p class="hint">${esc(key)}</p>`;
  if(type==='text') return `<label for="${id}">${esc(label)}<input type="text" id="${id}" data-k="${key}"></label>`;
  if(type==='textarea') return `<label for="${id}">${esc(label)}<textarea id="${id}" data-k="${key}"></textarea></label>`;
  if(type==='check') return `<label class="check" for="${id}"><input type="checkbox" id="${id}" data-k="${key}">${esc(label)}</label>`;
  if(type==='color') return `<label class="color" for="${id}">${esc(label)}<input type="color" id="${id}" data-k="${key}"></label>`;
  if(type==='range') return `<label class="range" for="${id}"><span>${esc(label)}</span><input type="range" id="${id}" min="${a}" max="${b}" step="${c}" data-k="${key}" data-num></label>`;
  if(type==='pairs') return `<div class="pairs"><div class="head">${esc(label)}</div>${S[key].map((_,i)=>
      `<div class="pair"><input type="text" aria-label="${esc(label)} ${i+1} label" data-k="${key}.${i}.label"><input type="text" aria-label="${esc(label)} ${i+1} value" data-k="${key}.${i}.value"></div>`).join('')}</div>`;
  if(type==='image'){
    const extra = key==='photo' ? `<button data-act="center">Re-center photo</button>`
                : key==='badge' ? `<button data-img-clear="badge">Use built-in badge</button>`
                : `<button data-img-clear="${key}">Remove</button>`;
    return `<div class="img">${esc(label)}<div class="btns"><button data-img="${key}">Choose image…</button>${extra}</div></div>`;
  }
  return '';
}
function buildPanel(){
  $('#fields').innerHTML = SCHEMA.map(s => `<details${s.open?' open':''}><summary>${esc(s.title)}</summary><div class="fields">${s.items.map(field).join('')}</div></details>`).join('');
  syncPanel();
}
function syncPanel(){
  document.querySelectorAll('[data-k]').forEach(el => {
    const v = get(el.dataset.k);
    if(el.type==='checkbox') el.checked = !!v; else el.value = v ?? '';
  });
}
$('#fields').addEventListener('input', e => {
  const el = e.target.closest('[data-k]'); if(!el) return;
  set(el.dataset.k, el.type==='checkbox' ? el.checked : el.dataset.num !== undefined ? parseFloat(el.value) : el.value);
  queueRender();
});

/* ---------- card markup ---------- */
function vars(){const c=S.colors;return `--accent:${c.accent};--dark:${c.dark};--cream:${c.cream};--photo-bg:${c.photoBg};--last:${c.lastName};--team:${c.teamName};--stamp:${c.stamp};--rule:${c.rule};--ns:${S.nameSize}px;--nts:${S.noteSize}px`}
function photoStyle(){
  const W=662,H=696;
  if(!photoDims) return 'width:100%;height:100%;object-fit:cover;left:0;top:0';
  const s=Math.max(W/photoDims.w,H/photoDims.h)*S.photoZoom, w=photoDims.w*s, h=photoDims.h*s;
  return `width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;left:${((W-w)/2+S.photoX).toFixed(1)}px;top:${((H-h)/2+S.photoY).toFixed(1)}px`;
}
function badgeHTML(){
  if(S.badge) return `<div class="f-badge" style="background-image:url('${cssUrl(S.badge)}')"></div>`;
  const c=S.colors;
  return `<div class="f-badge"><svg viewBox="0 0 118 104" xmlns="http://www.w3.org/2000/svg" aria-label="Rookie card badge">
    <path d="M8 5H110V60L59 99L8 60Z" fill="${c.dark}" stroke="${c.accent}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M17 13H101V56L59 88L17 56Z" fill="none" stroke="${c.cream}" stroke-width="2"/>
    <text x="59" y="52" text-anchor="middle" font-family="Graduate, Rockwell, Georgia, serif" font-size="34" fill="${c.cream}">RC</text>
    <text x="59" y="71" text-anchor="middle" font-family="Archivo Narrow, Arial Narrow, Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="${c.teamName}">ROOKIE</text>
  </svg></div>`;
}
function frontHTML(){
  return `<div class="card front" style="${vars()}"><div class="f-inner">
    <div class="f-top"><div class="f-school">${esc(S.school)}</div><div class="f-league">${esc(S.league)}</div></div>
    <div class="f-photo" data-drag>
      ${S.photo ? `<img class="f-photo-img" src="${esc(S.photo)}" alt="Player photo" style="${photoStyle()}" draggable="false">` : `<div class="f-empty">Add a player photo</div>`}
      ${S.showNumber ? `<div class="f-num"><div class="f-num-l">NO.</div><div class="f-num-n">${esc(S.number)}</div></div>` : ''}
      ${S.showRookie ? badgeHTML() : ''}
    </div>
    <div class="f-bottom">
      ${S.position ? `<div class="f-pos"><span class="f-pos-cut"></span>${esc(S.position)}</div>` : ''}
      <div class="f-names">
        <div class="f-first">${esc(S.first)}</div>
        <div class="f-last">${esc(S.last)}</div>
        <div class="f-team"><span>${esc(S.team)}</span>${S.showSerial ? `<span class="f-serial">${esc(S.serial)}</span>` : ''}</div>
      </div>
    </div>
    ${S.logo ? `<div class="f-logo" style="background-image:url('${cssUrl(S.logo)}')"></div>` : ''}
  </div></div>`;
}
function backHTML(){
  const sub = [S.position, S.number ? 'NO. '+S.number : '', S.team].filter(Boolean).join(' · ');
  return `<div class="card back" style="${vars()}"><div class="b-inner">
    <div class="b-head">
      ${S.backCircle ? `<div class="b-circle">${esc(S.backCircle)}</div>` : ''}
      <div class="b-id"><div class="b-name">${esc((S.first+' '+S.last).trim())}</div><div class="b-sub">${esc(sub)}</div></div>
      ${S.logo ? `<div class="b-logo" style="background-image:url('${cssUrl(S.logo)}')"></div>` : ''}
    </div>
    <div class="b-stats">${S.stats.map(x=>`<div class="b-stat"><div class="lbl">${esc(x.label)}</div><div class="val">${esc(x.value)}</div></div>`).join('')}</div>
    <div class="b-facts-wrap"><div class="b-facts-h">${esc(S.factsTitle)}</div>
      <div class="b-facts">${S.facts.map(x=>`<div class="b-fact"><div class="lbl">${esc(x.label)}</div><div class="val">${esc(x.value)}</div></div>`).join('')}</div>
    </div>
    <div class="b-foot">
      <div class="b-note"><div class="b-note-h">${esc(S.noteTitle)}</div><div class="b-note-t">${nl(S.note)}</div></div>
      <div class="b-season"><div class="s-sm">${esc(S.season[0])}</div><div class="s-lg">${esc(S.season[1])}</div><div class="s-sm">${esc(S.season[2])}</div></div>
    </div>
  </div></div>`;
}

/* ---------- rendering & layout ---------- */
let raf = 0;
function queueRender(){ if(!raf) raf = requestAnimationFrame(()=>{raf=0;render();autosave()}) }
function render(){
  $('#frameFront').innerHTML = frontHTML();
  $('#frameBack').innerHTML = backHTML();
  fit();
}
function fit(){
  const st = $('#stage'), W = st.clientWidth - 56, H = st.clientHeight - 90;
  let s = Math.min((W-28)/1800, H/1050, .75);
  if(s < .3 || window.innerWidth <= 820) s = Math.min(W/1050, .6);
  scale = Math.max(s, .2);
  const ff=$('#frameFront'), fb=$('#frameBack');
  ff.style.width = 750*scale+'px'; ff.style.height = 1050*scale+'px';
  fb.style.width = 1050*scale+'px'; fb.style.height = 750*scale+'px';
  document.querySelectorAll('.frame > .card').forEach(c => c.style.transform = `scale(${scale})`);
}
new ResizeObserver(fit).observe($('#stage'));

function loadPhotoDims(cb){
  photoDims = null;
  if(!S.photo){ cb && cb(); return }
  const im = new Image();
  im.onload = () => { photoDims = {w:im.naturalWidth, h:im.naturalHeight}; cb && cb() };
  im.onerror = () => cb && cb();
  im.src = S.photo;
}

/* ---------- drag to reposition photo ---------- */
let drag = null;
$('#frameFront').addEventListener('pointerdown', e => {
  const area = e.target.closest('[data-drag]'); if(!area || !S.photo) return;
  drag = {x:S.photoX, y:S.photoY, px:e.clientX, py:e.clientY, area};
  area.setPointerCapture(e.pointerId); area.classList.add('dragging'); e.preventDefault();
});
$('#frameFront').addEventListener('pointermove', e => {
  if(!drag) return;
  S.photoX = Math.round(drag.x + (e.clientX-drag.px)/scale);
  S.photoY = Math.round(drag.y + (e.clientY-drag.py)/scale);
  const img = drag.area.querySelector('.f-photo-img'); if(img) img.style.cssText = photoStyle();
});
function endDrag(){ if(!drag) return; drag.area.classList.remove('dragging'); drag = null; autosave() }
$('#frameFront').addEventListener('pointerup', endDrag);
$('#frameFront').addEventListener('pointercancel', endDrag);

/* ---------- images ---------- */
let imgTarget = null;
function readImage(file){
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('read'));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('decode'));
      im.onload = () => {
        const max = 2000, k = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
        if(k === 1 && file.size < 1.5e6){ res(r.result); return }
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.naturalWidth*k); cv.height = Math.round(im.naturalHeight*k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        const keepAlpha = /png|webp|gif|svg/.test(file.type);
        res(cv.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', .9));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
$('#imgFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || !imgTarget) return;
  try{
    const data = await readImage(f);
    S[imgTarget] = data;
    if(imgTarget === 'photo'){ S.photoZoom = 1; S.photoX = 0; S.photoY = 0; syncPanel(); loadPhotoDims(()=>{render();autosave()}) }
    else { render(); autosave() }
    if(imgTarget === 'badge' && !S.showRookie){ S.showRookie = true; syncPanel(); render() }
  }catch{ toast('That file could not be opened as an image. Try a JPG or PNG.') }
});

/* ---------- toolbar actions ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.img){ imgTarget = b.dataset.img; $('#imgFile').click(); return }
  if(b.dataset.imgClear){ S[b.dataset.imgClear] = ''; render(); autosave(); return }
  const a = b.dataset.act;
  if(a==='center'){ S.photoX = 0; S.photoY = 0; render(); autosave() }
  if(a==='print') doPrint();
  if(a==='png-front') exportPNG('front');
  if(a==='png-back') exportPNG('back');
  if(a==='save') download(new Blob([JSON.stringify(S)],{type:'application/json'}), fileBase()+'-card.json');
  if(a==='open') $('#openFile').click();
  if(a==='new'){
    if(!confirm('Start a new player? Colors, logo and team text stay; player details and the photo are cleared. Save a design file first if you want to keep this one.')) return;
    Object.assign(S,{first:'',last:'',number:'',position:'',backCircle:'',photo:'',photoZoom:1,photoX:0,photoY:0,note:''});
    S.stats.forEach(x=>x.value=''); S.facts.forEach(x=>x.value='');
    photoDims=null; syncPanel(); render(); autosave();
  }
  if(a==='reset'){
    if(!confirm('Reset everything to the blank template? Unsaved changes will be lost.')) return;
    S = clone(DEFAULTS); syncPanel(); loadPhotoDims(()=>{render();autosave()});
  }
});
$('#openFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{ applyState(JSON.parse(r.result)); toast('Design opened.') }
    catch{ toast('That file is not a card design file. Choose a .json file saved from this page.') }
  };
  r.readAsText(f);
});
function applyState(obj){
  const base = clone(DEFAULTS);
  if(typeof obj !== 'object' || !obj || !('colors' in obj)) throw new Error('bad');
  S = Object.assign(base, obj, {colors:Object.assign(base.colors, obj.colors||{})});
  for(const k in S.colors) if(!/^#[0-9a-f]{6}$/i.test(S.colors[k])) S.colors[k] = DEFAULTS.colors[k] || '#000000';
  for(const k of ['photo','logo','badge']) S[k] = okUrl(S[k]);
  for(const k of ['photoZoom','photoX','photoY','nameSize','noteSize']){ const n = parseFloat(S[k]); S[k] = isFinite(n) ? n : DEFAULTS[k] }
  for(const k of ['stats','facts']) if(!Array.isArray(S[k]) || S[k].length !== DEFAULTS[k].length) S[k] = clone(DEFAULTS[k]);
  if(!Array.isArray(S.season) || S.season.length !== 3) S.season = clone(DEFAULTS.season);
  syncPanel(); loadPhotoDims(render);
}
function fileBase(){ return ((S.first+'-'+S.last).trim().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()) || 'baseball' }
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
let tt;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), 4200) }

function doPrint(){
  const rot = confirm('Print the back rotated to portrait, so it lines up with the front for double-sided printing?\n\nOK = rotate the back   Cancel = keep it landscape');
  $('#print').innerHTML = `<div class="pp pp-front">${frontHTML()}</div><div class="pp pp-back${rot?' rot':''}">${backHTML()}</div>`;
  setTimeout(() => window.print(), 150);
}

/* PNG export uses html2canvas, loaded only when needed (requires internet) */
function loadH2C(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((res,rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = () => window.html2canvas ? res() : rej(); s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function exportPNG(side){
  try{ await loadH2C() }catch{ toast('PNG download needs an internet connection. "Print / save PDF" works offline.'); return }
  toast('Making the image…');
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-30000px;top:0';
  holder.innerHTML = side === 'front' ? frontHTML() : backHTML();
  document.body.appendChild(holder);
  try{
    if(document.fonts) await document.fonts.ready;
    await Promise.all([...holder.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r)));
    const cv = await html2canvas(holder.firstElementChild, {scale:2, backgroundColor:null, logging:false});
    cv.toBlob(b => { download(b, `${fileBase()}-${side}.png`); toast('Image downloaded (600 dpi at trading-card size).') });
  }catch{ toast('The image could not be made. "Print / save PDF" is the fallback.') }
  finally{ holder.remove() }
}

/* ---------- autosave (only works when opened as a file in a normal browser) ---------- */
let st;
function autosave(){
  clearTimeout(st);
  st = setTimeout(() => { try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)) }catch(e){} }, 500);
}
function restore(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ applyState(JSON.parse(raw)); return true } }catch(e){}
  return false;
}

buildPanel();
if(!restore()) loadPhotoDims(render); else render();
if(document.fonts) document.fonts.ready.then(fit);
/* Optional: open a saved design straight from the address, e.g. ?design=designs/my-team.json */
const designParam = new URLSearchParams(location.search).get('design');
if(designParam){
  fetch(designParam).then(r => { if(!r.ok) throw 0; return r.json() })
    .then(o => { applyState(o); toast('Design loaded.') })
    .catch(() => toast('That design file could not be loaded. Check the file name in the address.'));
}
</script>
